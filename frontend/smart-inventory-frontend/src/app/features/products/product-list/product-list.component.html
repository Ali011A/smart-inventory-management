<div class="page-header">
  <div>
    <h1>Products</h1>
    <p>Manage products and pricing.</p>
  </div>
  <button mat-flat-button color="primary" (click)="createProduct()">New product</button>
</div>

<div class="toolbar-row">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search products</mat-label>
    <input matInput [(ngModel)]="search" (keyup.enter)="onSearch()" />
  </mat-form-field>
  <button mat-stroked-button type="button" (click)="clearSearch()">Clear</button>
</div>

<mat-card *ngIf="errorMessage" class="error-card">
  <mat-card-content>{{ errorMessage }}</mat-card-content>
</mat-card>

<mat-card *ngIf="loading" class="loader-card">
  <mat-card-content>
    <div class="loader">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  </mat-card-content>
</mat-card>

<mat-card *ngIf="!loading && !errorMessage">
  <table mat-table [dataSource]="products" class="product-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let product">{{ product.name }}</td>
    </ng-container>

    <ng-container matColumnDef="sku">
      <th mat-header-cell *matHeaderCellDef>SKU</th>
      <td mat-cell *matCellDef="let product">{{ product.sku }}</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Category</th>
      <td mat-cell *matCellDef="let product">{{ product.category || '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Price</th>
      <td mat-cell *matCellDef="let product">{{ product.price | currency }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let product">
        <button mat-icon-button color="primary" (click)="editProduct(product)" aria-label="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteProduct(product)" aria-label="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
