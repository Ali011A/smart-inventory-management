<div class="page-header">
  <div>
    <h1>Inventory</h1>
    <p>Current stock levels by product and warehouse.</p>
  </div>
  <button mat-flat-button color="primary" routerLink="/inventory/transaction">New transaction</button>
</div>

<div class="toolbar-row">
  <mat-form-field appearance="outline" class="warehouse-select">
    <mat-label>Filter by warehouse</mat-label>
    <mat-select [(value)]="selectedWarehouseId" (selectionChange)="onWarehouseChange()">
      <mat-option [value]="undefined">All warehouses</mat-option>
      <mat-option *ngFor="let warehouse of warehouses" [value]="warehouse.id">{{ warehouse.name }}</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<mat-card *ngIf="errorMessage" class="error-card">
  <mat-card-content>{{ errorMessage }}</mat-card-content>
</mat-card>

<mat-card *ngIf="loading" class="loader-card">
  <mat-card-content>
    <div class="loader">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  </mat-card-content>
</mat-card>

<mat-card *ngIf="!loading && !errorMessage">
  <table mat-table [dataSource]="stock" class="stock-table">
    <ng-container matColumnDef="productName">
      <th mat-header-cell *matHeaderCellDef>Product</th>
      <td mat-cell *matCellDef="let item">{{ item.productName }}</td>
    </ng-container>

    <ng-container matColumnDef="sku">
      <th mat-header-cell *matHeaderCellDef>SKU</th>
      <td mat-cell *matCellDef="let item">{{ item.sku }}</td>
    </ng-container>

    <ng-container matColumnDef="warehouseName">
      <th mat-header-cell *matHeaderCellDef>Warehouse</th>
      <td mat-cell *matCellDef="let item">{{ item.warehouseName }}</td>
    </ng-container>

    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Quantity</th>
      <td mat-cell *matCellDef="let item">{{ item.quantity }}</td>
    </ng-container>

    <ng-container matColumnDef="lastUpdated">
      <th mat-header-cell *matHeaderCellDef>Last Updated</th>
      <td mat-cell *matCellDef="let item">{{ item.lastUpdated | date:'short' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['productName','sku','warehouseName','quantity','lastUpdated']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['productName','sku','warehouseName','quantity','lastUpdated']"></tr>
  </table>
</mat-card>
