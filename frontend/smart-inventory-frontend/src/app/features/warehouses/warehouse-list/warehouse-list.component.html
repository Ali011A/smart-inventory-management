<div class="page-header">
  <div>
    <h1>Warehouses</h1>
    <p>Manage warehouse locations and storage areas.</p>
  </div>
  <button mat-flat-button color="primary" (click)="createWarehouse()">New warehouse</button>
</div>

<div class="toolbar-row">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search warehouses</mat-label>
    <input matInput [(ngModel)]="search" (keyup.enter)="searchWarehouses()" />
  </mat-form-field>
  <button mat-stroked-button type="button" (click)="clearSearch()">Clear</button>
</div>

<mat-card *ngIf="errorMessage" class="error-card">
  <mat-card-content>{{ errorMessage }}</mat-card-content>
</mat-card>

<mat-card *ngIf="loading" class="loader-card">
  <mat-card-content>
    <div class="loader">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  </mat-card-content>
</mat-card>

<mat-card *ngIf="!loading && !errorMessage">
  <table mat-table [dataSource]="warehouses" class="warehouse-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let warehouse">{{ warehouse.name }}</td>
    </ng-container>

    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef>Location</th>
      <td mat-cell *matCellDef="let warehouse">{{ warehouse.location || '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let warehouse">
        <button mat-icon-button color="primary" (click)="editWarehouse(warehouse)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteWarehouse(warehouse)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['name','location','actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['name','location','actions']"></tr>
    <tr class="no-data-row" *ngIf="warehouses.length === 0">
      <td class="mat-cell" colspan="3">No warehouses found.</td>
    </tr>
  </table>
</mat-card>
