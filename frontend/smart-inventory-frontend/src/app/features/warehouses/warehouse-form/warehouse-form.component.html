<div class="page-header">
  <div>
    <h1>{{ isEditMode ? 'Edit Warehouse' : 'Create Warehouse' }}</h1>
    <p>{{ isEditMode ? 'Update warehouse information.' : 'Add a new warehouse location.' }}</p>
  </div>
</div>

<mat-card>
  <mat-card-content>
    <form [formGroup]="warehouseForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
        <mat-error *ngIf="warehouseForm.get('name')?.hasError('required')">Name is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Location</mat-label>
        <input matInput formControlName="location" />
      </mat-form-field>

      <div *ngIf="errorMessage" class="error-alert">{{ errorMessage }}</div>

      <div class="actions-row">
        <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="warehouseForm.invalid || saving">
          <mat-spinner *ngIf="saving" diameter="20"></mat-spinner>
          <span *ngIf="!saving">{{ isEditMode ? 'Save' : 'Create' }}</span>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
